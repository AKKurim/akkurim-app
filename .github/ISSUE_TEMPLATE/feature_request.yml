name: Feature Request 💡
description: Suggest a new feature or improvement
title: "Feature: "
labels: ["enhancement", "from-app"]
assignees: [your-github-username]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details about the feature you would like to see implemented.
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: Describe the feature and its benefits.
      placeholder: Provide a clear and concise description.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Nice to have
        - Important
        - Urgent
    validations:
      required: true
